name: Spunky Tensor security

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '29 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    uses: spunkytensor/.github/.github/workflows/trivy.yml@ed53814ed23f76c11fa4a91f57f99de903c18bfc
    with:
      baseline-sha: ed53814ed23f76c11fa4a91f57f99de903c18bfc

  supply-chain:
    name: Audit npm dependencies and generate SBOM
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pin npm security tooling
        run: node scripts/setup-npm.mjs
      - name: Generate lockfile CycloneDX SBOM
        run: |
          mkdir -p reports/security
          npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > reports/security/orbit-sbom.cdx.json
      - name: Audit all dependencies, including development tools
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports/security
          set +e
          npm audit --package-lock-only --audit-level=high --json > reports/security/npm-audit.json
          status=$?
          echo "$status" > reports/security/npm-audit.exit-code
          exit "$status"
      - name: Upload security evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-supply-chain-artifacts
          path: reports/security/
          retention-days: 30
          if-no-files-found: warn

  release-evidence:
    if: github.event_name == 'release'
    needs: [source, supply-chain]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-supply-chain-artifacts
          path: reports/security
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: security-source
          path: reports/security
      - name: Retain security evidence with the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" reports/security/* --clobber
