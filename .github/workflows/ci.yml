name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (Node ${{ matrix.node }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          # Bundled npm may be too old for devEngines, even for cache queries.
          package-manager-cache: false
      - name: Set up age-checked npm
        run: node scripts/setup-npm.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
      - name: Test and enforce 72-hour package release minimum
        run: |
          node --test scripts/release-age.check.mjs
          npm run deps
      - name: Regression tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=reports/vitest.xml
      - name: Typecheck and production build
        run: npm run build
      - name: Verify production assets and license inventory
        run: node --test scripts/check-dist.mjs
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regression-node-${{ matrix.node }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
